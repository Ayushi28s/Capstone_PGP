
name: CommerceOps AI AWS Deploy

on:
  push:
    branches:
      - groq-aws-deployment
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPOSITORY: commerceops-backend
  ECR_FRONTEND_REPOSITORY: commerceops-frontend
  ECS_CLUSTER: commerceops-cluster
  ECS_SERVICE: commerceops-app-task-service-f1dt78ar
  ECS_TASK_DEFINITION: commerceops-app-task
  GROQ_MODEL: openai/gpt-oss-120b
  GROQ_PARAMETER_ARN: arn:aws:ssm:ap-south-1:024899754411:parameter/commerceops/groq-api-key

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MODEL: openai/gpt-oss-120b
      REDIS_URL: redis://localhost:6379/0
      DATA_DIR: ./data
      SQLITE_DB_PATH: ./data/commerceops.db
      CHECKPOINT_DB_PATH: ./data/checkpoints.db
      CHROMA_DIR: ./data/chroma
      KNOWLEDGE_GRAPH_PATH: ./data/knowledge_graph.json
      INTENT_ROUTER_MODEL_PATH: ./data/intent_router.joblib
      MCP_SQLITE_DB_PATH: ./data/commerceops.db
      PHOENIX_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            frontend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Compile backend
        working-directory: backend
        run: |
          python -m compileall app mcp_servers scripts -q

      - name: Validate backend imports
        working-directory: backend
        run: |
          python -c "import app.main"
          python -c "import app.worker"
          python -c "import app.agents.support_crew"
          python -c "import app.agents.knowledge_agent"
          python -c "import app.agents.merchandising_agent"
          python -c "import app.agents.market_intel_agent"

      - name: Seed runtime data
        working-directory: backend
        run: |
          python scripts/seed_db.py

      - name: Run preflight check
        working-directory: backend
        run: |
          python preflight_check.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile frontend
        working-directory: frontend
        run: |
          python -m compileall . -q

      - name: Validate frontend imports
        working-directory: frontend
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          python -c "import api_client"

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" \
            ./backend

          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }}" \
            -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" \
            ./frontend

          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"

      - name: Download and prepare ECS task definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --region "$AWS_REGION" \
            --query "taskDefinition" \
            > task-definition-current.json

          jq \
            --arg backend_image "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:${{ github.sha }}" \
            --arg frontend_image "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:${{ github.sha }}" \
            --arg groq_model "$GROQ_MODEL" \
            --arg groq_parameter "$GROQ_PARAMETER_ARN" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )
            |
            .containerDefinitions |= map(
              if (.name == "seed" or .name == "backend" or .name == "worker") then
                .environment = (
                  (.environment // [])
                  | map(select(
                      .name != "MODEL"
                      and .name != "OPENROUTER_API_KEY"
                      and .name != "GROQ_API_KEY"
                    ))
                  + [{"name": "MODEL", "value": $groq_model}]
                )
                |
                .secrets = (
                  (.secrets // [])
                  | map(select(
                      .name != "OPENROUTER_API_KEY"
                      and .name != "GROQ_API_KEY"
                    ))
                  + [{
                      "name": "GROQ_API_KEY",
                      "valueFrom": $groq_parameter
                    }]
                )
              else
                .
              end
              |
              if .name == "seed" then
                .image = $backend_image
                |
                .user = "0"
                |
                .command = [
                  "sh",
                  "-c",
                  "mkdir -p /app/data && cp -a /app/bootstrap_data/. /app/data/ && python scripts/seed_db.py && chown -R commerceops:commerceops /app/data"
                ]

              elif .name == "backend" then
                .image = $backend_image
                |
                .healthCheck = {
                  "command": [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)"
                  ],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                }

              elif .name == "worker" then
                .image = $backend_image
                |
                .command = [
                  "python",
                  "-m",
                  "app.worker"
                ]
                |
                .healthCheck = {
                  "command": [
                    "CMD",
                    "python",
                    "-c",
                    "import socket; s=socket.create_connection((\"127.0.0.1\", 9100), timeout=3); s.close()"
                  ],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 30
                }

              elif .name == "frontend" then
                .image = $frontend_image
                |
                .healthCheck = {
                  "command": [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8501/_stcore/health\", timeout=3)"
                  ],
                  "interval": 30,
                  "timeout": 5,
                  "retries": 3,
                  "startPeriod": 60
                }

              else
                .
              end
            )
            ' task-definition-current.json \
            > task-definition-new.json

      - name: Verify prepared container configuration
        run: |
          jq -e \
            --arg model "$GROQ_MODEL" \
            --arg parameter "$GROQ_PARAMETER_ARN" \
            '
            [
              .containerDefinitions[]
              | select(
                  .name == "seed"
                  or .name == "backend"
                  or .name == "worker"
                )
              | (
                  any(.environment[]?; .name == "MODEL" and .value == $model)
                  and
                  any(.secrets[]?; .name == "GROQ_API_KEY" and .valueFrom == $parameter)
                  and
                  all(.secrets[]?; .name != "OPENROUTER_API_KEY")
                )
            ]
            | (length == 3 and all(.[]; . == true))
            ' task-definition-new.json

          jq '
            .containerDefinitions[]
            | {
                name,
                image,
                model: [.environment[]? | select(.name == "MODEL")],
                secretNames: [.secrets[]? | .name],
                dependsOn
              }
            ' task-definition-new.json

      - name: Register new ECS task definition
        id: register-task
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-new.json \
            --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition_arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered task definition: $TASK_DEF_ARN"

      - name: Check whether ECS service exists
        id: check-service
        run: |
          STATUS=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].status" \
            --output text)

          if [ "$STATUS" = "ACTIVE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ECS service is not active. Skipping service update."
            echo "Create the service using the registered task definition."
          fi

      - name: Update ECS service
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      - name: Wait for ECS service stability
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"

      - name: Show ECS service status
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION" \
            --query "services[0].{
              Status:status,
              Desired:desiredCount,
              Running:runningCount,
              Pending:pendingCount,
              TaskDefinition:taskDefinition,
              DeploymentStatus:deployments[0].rolloutState,
              Events:events[0:5]
            }"

      - name: Show deployment result
        run: |
          echo "Registered task definition:"
          echo "${{ steps.register-task.outputs.task_definition_arn }}"

          if [ "${{ steps.check-service.outputs.exists }}" = "false" ]; then
            echo "Docker images were pushed and the task definition was registered."
            echo "The ECS service must be created separately."
          fi
